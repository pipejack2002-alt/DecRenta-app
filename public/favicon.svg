<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#1F4F47"/>
      <stop offset="100%" stop-color="#0F2F29"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo redondeado elegante estilo App Icon -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="#34D399" stroke-opacity="0.25"/>

  <!-- Emblema TributoApp 'T' estilizado y Documento Fiscal -->
  <g filter="url(#glow)">
    <!-- Barra superior de la T con pliegue de hoja fiscal -->
    <path d="M7 8.5C7 7.67 7.67 7 8.5 7H23.5C24.33 7 25 7.67 25 8.5V10C25 10.55 24.55 11 24 11H8C7.45 11 7 10.55 7 10V8.5Z" fill="#F3EEE4"/>
    
    <!-- Acento dorado en la esquina superior derecha -->
    <path d="M22 7H24C24.55 7 25 7.45 25 8V10H22V7Z" fill="url(#goldGrad)"/>

    <!-- Pilar vertical de la T / columna de balance -->
    <path d="M13.5 11H18.5V23.5C18.5 24.33 17.83 25 17 25H15C14.17 25 13.5 24.33 13.5 23.5V11Z" fill="#F3EEE4"/>
    
    <!-- Líneas de casillas/balanza fiscal sutiles -->
    <rect x="9" y="14" width="2.5" height="1.5" rx="0.5" fill="#34D399" fill-opacity="0.8"/>
    <rect x="9" y="17.5" width="2.5" height="1.5" rx="0.5" fill="#34D399" fill-opacity="0.8"/>
    <rect x="20.5" y="14" width="2.5" height="1.5" rx="0.5" fill="#34D399" fill-opacity="0.8"/>
    <rect x="20.5" y="17.5" width="2.5" height="1.5" rx="0.5" fill="#34D399" fill-opacity="0.8"/>
  </g>
</svg>
