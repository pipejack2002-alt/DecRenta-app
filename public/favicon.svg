<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente Esmeralda Corporativo HD -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <!-- Gradiente Oro Financiero Premium -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Sombra suave del icono -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Escudo Base HD -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#favGold)" stroke-width="2" stroke-opacity="0.75"/>

  <!-- Brillo superior -->
  <path d="M4 16C4 9.37258 9.37258 4 16 4H48C54.6274 4 60 9.37258 60 16V28C48 30 16 30 4 28V16Z" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Símbolo T y Balanza Tributaria -->
  <g filter="url(#favGlow)">
    <!-- Barra superior T -->
    <path d="M14 17C14 15.3431 15.3431 14 17 14H47C48.6569 14 50 15.3431 50 17V21C50 21.5523 49.5523 22 49 22H15C14.4477 22 14 21.5523 14 21V17Z" fill="#F8FAFC"/>
    
    <!-- Acento Dorado ala derecha -->
    <path d="M40 14H47C48.6569 14 50 15.3431 50 17V22H40V14Z" fill="url(#favGold)"/>

    <!-- Pilar Vertical T -->
    <path d="M27 22H37V45C37 47.2091 35.2091 49 33 49H31C28.7909 49 27 47.2091 27 45V22Z" fill="#F8FAFC"/>

    <!-- Platillos de la balanza fiscal / Checks -->
    <circle cx="20" cy="31" r="3" fill="url(#favGold)"/>
    <circle cx="44" cy="31" r="3" fill="url(#favGold)"/>
    <line x1="20" y1="22" x2="20" y2="28" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="44" y1="22" x2="44" y2="28" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Checkmark central de precisión fiscal -->
    <path d="M29 34L31 36L35 31" stroke="#064E3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
