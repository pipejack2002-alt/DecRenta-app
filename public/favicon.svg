<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente Esmeralda Corporativo HD -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <!-- Gradiente Oro Financiero Premium -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Sombra suave del icono -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Escudo Base HD -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#favGold)" stroke-width="2" stroke-opacity="0.75"/>

  <!-- Brillo superior -->
  <path d="M4 16C4 9.37258 9.37258 4 16 4H48C54.6274 4 60 9.37258 60 16V28C48 30 16 30 4 28V16Z" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Símbolo 'D' de DeclaraPro y Balanza Tributaria -->
  <g filter="url(#favGlow)">
    <!-- Letra D -->
    <path d="M18 16H32C41.9411 16 50 23.1634 50 32C50 40.8366 41.9411 48 32 48H18V16Z" fill="none" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 16C41.9411 16 50 23.1634 50 32" fill="none" stroke="url(#favGold)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Puntos de Balanza -->
    <circle cx="28" cy="30" r="3" fill="url(#favGold)"/>
    <circle cx="39" cy="30" r="3" fill="url(#favGold)"/>

    <!-- Checkmark de precisión fiscal -->
    <path d="M26 36L31 41L42 27" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
